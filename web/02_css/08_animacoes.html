<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CSS - transicoes e animacoes</title>
  <style>
    /* AULA 08 - Transicoes e animacoes */
    .botao {
      background: #1e88e5;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;   /* muda suavemente */
    }
    .botao:hover { background: #0d47a1; transform: scale(1.1); }

    /* @keyframes define os passos da animacao */
    @keyframes piscar {
      0%   { opacity: 1; }
      50%  { opacity: 0.1; }
      100% { opacity: 1; }
    }
    .led {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: red;
      margin: 30px;
      animation: piscar 1s infinite;    /* nome, duracao, repeticao */
    }
  </style>
</head>
<body>
  <button class="botao">Passe o mouse</button>
  <div class="led"></div>

  <!-- EXERCICIOS:
       1. Deixe o LED piscando mais rapido (0.5s).
       2. Mude a cor do LED para verde.
       3. Crie uma animacao que gira o LED (transform: rotate(360deg)). -->
</body>
</html>
