<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CSS - seletores</title>
  <style>
    /* AULA 02 - Seletores: escolhem quais elementos recebem o estilo */
    p { color: gray; }                     /* por tag: todos os <p> */
    .aviso { color: orange; }              /* por classe (comeca com ponto) */
    #principal { color: green; font-size: 24px; }   /* por id (comeca com #) */
    ul li { list-style: square; }          /* li dentro de ul */
    a:hover { color: red; }                /* quando o mouse passa por cima */
    li:first-child { font-weight: bold; }  /* primeiro item da lista */
  </style>
</head>
<body>
  <p>Paragrafo comum (cinza).</p>
  <p class="aviso">Paragrafo com classe "aviso" (laranja).</p>
  <p id="principal">Paragrafo com id "principal" (verde e maior).</p>
  <ul>
    <li>Primeiro item (negrito)</li>
    <li>Segundo item</li>
  </ul>
  <a href="#">Passe o mouse aqui</a>

  <!-- EXERCICIOS:
       1. Crie a classe .erro com cor vermelha e use em um paragrafo.
       2. Use li:last-child para colorir o ultimo item. -->
</body>
</html>
