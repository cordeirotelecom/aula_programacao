<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Minha primeira pagina</title>
</head>
<body>
  <!-- AULA 01 - Estrutura basica de uma pagina HTML
       HTML usa "tags": <tag> abre e </tag> fecha.
       <head> guarda informacoes (titulo da aba); <body> guarda o que aparece. -->
  <h1>Ola, mundo!</h1>
  <p>Esta e a minha primeira pagina HTML.</p>

  <!-- EXERCICIOS:
       1. Troque o titulo da aba (<title>) e o texto do <h1> pelo seu nome.
       2. Adicione mais um paragrafo <p> falando do seu curso.
       Salve (Ctrl+S) e atualize o navegador (F5). -->
</body>
</html>
<!-- Executar (PowerShell): powershell -ExecutionPolicy Bypass -File ".\web\abrir.ps1" 01_primeira_pagina -->
