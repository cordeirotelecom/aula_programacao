<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tabelas</title>
</head>
<body>
  <!-- AULA 05 - Tabelas
       <table> tabela; <tr> linha; <th> cabecalho; <td> celula. -->
  <h1>Notas da turma</h1>
  <table border="1">
    <tr>
      <th>Aluno</th>
      <th>Nota</th>
    </tr>
    <tr>
      <td>Ana</td>
      <td>8,5</td>
    </tr>
    <tr>
      <td>Bruno</td>
      <td>6,0</td>
    </tr>
  </table>

  <!-- EXERCICIOS:
       1. Adicione mais dois alunos.
       2. Adicione uma coluna "Situacao" (Aprovado/Reprovado). -->
</body>
</html>
