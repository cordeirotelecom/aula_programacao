<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="calculadora">
    <div id="visor">0</div>
    <div class="teclas">
      <button data-tecla="7">7</button><button data-tecla="8">8</button><button data-tecla="9">9</button><button data-tecla="/" class="op">/</button>
      <button data-tecla="4">4</button><button data-tecla="5">5</button><button data-tecla="6">6</button><button data-tecla="*" class="op">*</button>
      <button data-tecla="1">1</button><button data-tecla="2">2</button><button data-tecla="3">3</button><button data-tecla="-" class="op">-</button>
      <button data-tecla="0">0</button><button data-tecla=".">.</button><button data-tecla="C" class="limpar">C</button><button data-tecla="+" class="op">+</button>
      <button data-tecla="=" class="igual">=</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
<!-- Projeto: calculadora com HTML + CSS Grid + JavaScript. -->
<!-- Executar (PowerShell): powershell -ExecutionPolicy Bypass -File ".\web\abrir.ps1" calculadora_web -->
