<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de tarefas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="app">
    <h1>Lista de tarefas</h1>
    <form id="formulario">
      <input id="entrada" placeholder="Nova tarefa..." autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>
    <ul id="lista"></ul>
    <p id="resumo"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
<!-- Projeto: HTML (estrutura) + estilo.css (visual) + script.js (comportamento). Tarefas ficam salvas no navegador. -->
<!-- Executar (PowerShell): powershell -ExecutionPolicy Bypass -File ".\web\abrir.ps1" lista_tarefas -->
